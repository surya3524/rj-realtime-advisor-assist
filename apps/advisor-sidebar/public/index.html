<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RJ Realtime Advisor Assist</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="call-panel" aria-label="Simulated Zoom call">
        <header class="topbar">
          <div>
            <p class="eyebrow">Concept POC</p>
            <h1>Realtime Advisor Assist</h1>
          </div>
          <div class="actions">
            <button id="startBtn" type="button">Start Demo</button>
            <button id="stopBtn" class="secondary" type="button">Stop</button>
          </div>
        </header>

        <div class="status-line">
          <span id="connectionDot" class="dot"></span>
          <span id="statusText">Demo ready. Start the simulated Zoom transcript when ready.</span>
        </div>

        <div id="transcript" class="transcript" aria-live="polite"></div>
      </section>

      <aside class="sidebar" aria-label="Advisor sidebar">
        <section class="sidebar-section">
          <div class="section-header">
            <p class="eyebrow">Advisor Sidebar</p>
            <h2>Grounded Suggestions</h2>
          </div>
          <div id="suggestions" class="suggestions" aria-live="polite"></div>
        </section>

        <section class="sidebar-section source-panel">
          <div class="section-header">
            <p class="eyebrow">Approved Sources</p>
            <h2>Knowledge Base</h2>
          </div>
          <div id="knowledge" class="knowledge-list"></div>
        </section>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
